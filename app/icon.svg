<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solid Pure Black Background -->

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="t-outer-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f5ff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#8b5cf6" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#d946ef" flood-opacity="0.4"/>
    </filter>

    <!-- Gradients -->
    <!-- T Left Wing (Cyan to Electric Blue) -->
    <linearGradient id="t-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <!-- T Right Wing & Stem (Cyan -> Electric Blue -> Violet -> Magenta) -->
    <linearGradient id="t-main-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="25%" stop-color="#0070f3" />
      <stop offset="65%" stop-color="#7928ca" />
      <stop offset="85%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Chip Neon Outer Border -->
    <linearGradient id="chip-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="35%" stop-color="#0070f3" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Chip Glass Body (Obsidian Dark Navy) -->
    <linearGradient id="chip-base-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0c1735" />
      <stop offset="45%" stop-color="#060c20" />
      <stop offset="100%" stop-color="#02040b" />
    </linearGradient>

    <!-- Diagonal Glass Glare Reflection -->
    <linearGradient id="chip-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#00f5ff" stop-opacity="0.08" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Circuit Gradients -->
    <linearGradient id="circ-vert-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>

    <linearGradient id="circ-horiz-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <linearGradient id="circ-horiz-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070f3" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="circ-vert-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Solid Pure Black Background -->
  <rect id="black-bg" width="512" height="512" fill="#000000" />

  <!-- ==================================================== -->
  <!-- 1. PCB CIRCUIT TRACKS (EXTENDING IN ALL 4 DIRECTIONS) -->
  <!-- ==================================================== -->

  <!-- Glow Halo Layer for Circuits -->
  <g opacity="0.65" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- TOP TRACKS -->
    <path d="M168 144 V84 L154 70 V48" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M202 144 V96 L192 86 V42" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M238 144 V102 L232 96 V36" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M274 144 V102 L280 96 V36" stroke="#00e5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M310 144 V96 L320 86 V42" stroke="#00c8ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M344 144 V84 L358 70 V48" stroke="#00a2ff" stroke-width="7" filter="url(#glow-cyan)" />

    <!-- BOTTOM TRACKS -->
    <path d="M168 368 V428 L154 442 V464" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M202 368 V416 L192 426 V470" stroke="#00d4ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M238 368 V410 L232 416 V476" stroke="#38bdf8" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M274 368 V410 L280 416 V476" stroke="#818cf8" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M310 368 V416 L320 426 V470" stroke="#c084fc" stroke-width="7" filter="url(#glow-magenta)" />
    <path d="M344 368 V428 L358 442 V464" stroke="#f472b6" stroke-width="7" filter="url(#glow-magenta)" />

    <!-- LEFT TRACKS -->
    <path d="M144 168 H84 L70 154 H48" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M144 202 H96 L86 192 H42" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M144 238 H102 L96 232 H36" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M144 274 H102 L96 280 H36" stroke="#00f5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M144 310 H96 L86 320 H42" stroke="#00e5ff" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M144 344 H84 L70 358 H48" stroke="#00c8ff" stroke-width="7" filter="url(#glow-cyan)" />

    <!-- RIGHT TRACKS -->
    <path d="M368 168 H428 L442 154 H464" stroke="#38bdf8" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M368 202 H416 L426 192 H470" stroke="#60a5fa" stroke-width="7" filter="url(#glow-cyan)" />
    <path d="M368 238 H410 L416 232 H476" stroke="#818cf8" stroke-width="7" filter="url(#glow-magenta)" />
    <path d="M368 274 H410 L416 280 H476" stroke="#a78bfa" stroke-width="7" filter="url(#glow-magenta)" />
    <path d="M368 310 H416 L426 320 H470" stroke="#c084fc" stroke-width="7" filter="url(#glow-magenta)" />
    <path d="M368 344 H428 L442 358 H464" stroke="#f472b6" stroke-width="7" filter="url(#glow-magenta)" />
  </g>

  <!-- Sharp Crisp Core Lines for Circuits -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- TOP TRACKS CORE -->
    <path d="M168 144 V84 L154 70 V48" stroke="url(#circ-vert-top)" stroke-width="3.2" />
    <path d="M202 144 V96 L192 86 V42" stroke="url(#circ-vert-top)" stroke-width="3.2" />
    <path d="M238 144 V102 L232 96 V36" stroke="url(#circ-vert-top)" stroke-width="3.8" />
    <path d="M274 144 V102 L280 96 V36" stroke="url(#circ-vert-top)" stroke-width="3.8" />
    <path d="M310 144 V96 L320 86 V42" stroke="url(#circ-vert-top)" stroke-width="3.2" />
    <path d="M344 144 V84 L358 70 V48" stroke="url(#circ-vert-top)" stroke-width="3.2" />

    <!-- BOTTOM TRACKS CORE -->
    <path d="M168 368 V428 L154 442 V464" stroke="url(#circ-vert-bottom)" stroke-width="3.2" />
    <path d="M202 368 V416 L192 426 V470" stroke="url(#circ-vert-bottom)" stroke-width="3.2" />
    <path d="M238 368 V410 L232 416 V476" stroke="url(#circ-vert-bottom)" stroke-width="3.8" />
    <path d="M274 368 V410 L280 416 V476" stroke="url(#circ-vert-bottom)" stroke-width="3.8" />
    <path d="M310 368 V416 L320 426 V470" stroke="url(#circ-vert-bottom)" stroke-width="3.2" />
    <path d="M344 368 V428 L358 442 V464" stroke="url(#circ-vert-bottom)" stroke-width="3.2" />

    <!-- LEFT TRACKS CORE -->
    <path d="M144 168 H84 L70 154 H48" stroke="url(#circ-horiz-left)" stroke-width="3.2" />
    <path d="M144 202 H96 L86 192 H42" stroke="url(#circ-horiz-left)" stroke-width="3.2" />
    <path d="M144 238 H102 L96 232 H36" stroke="url(#circ-horiz-left)" stroke-width="3.8" />
    <path d="M144 274 H102 L96 280 H36" stroke="url(#circ-horiz-left)" stroke-width="3.8" />
    <path d="M144 310 H96 L86 320 H42" stroke="url(#circ-horiz-left)" stroke-width="3.2" />
    <path d="M144 344 H84 L70 358 H48" stroke="url(#circ-horiz-left)" stroke-width="3.2" />

    <!-- RIGHT TRACKS CORE -->
    <path d="M368 168 H428 L442 154 H464" stroke="url(#circ-horiz-right)" stroke-width="3.2" />
    <path d="M368 202 H416 L426 192 H470" stroke="url(#circ-horiz-right)" stroke-width="3.2" />
    <path d="M368 238 H410 L416 232 H476" stroke="url(#circ-horiz-right)" stroke-width="3.8" />
    <path d="M368 274 H410 L416 280 H476" stroke="url(#circ-horiz-right)" stroke-width="3.8" />
    <path d="M368 310 H416 L426 320 H470" stroke="url(#circ-horiz-right)" stroke-width="3.2" />
    <path d="M368 344 H428 L442 358 H464" stroke="url(#circ-horiz-right)" stroke-width="3.2" />
  </g>

  <!-- Glowing PCB Terminal Nodes (Circles with halo, ring & core) -->
  <!-- Top Terminal Nodes -->
  <g>
    <circle cx="154" cy="48" r="7" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="154" cy="48" r="4.5" fill="#ffffff" />
    <circle cx="192" cy="42" r="7" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="192" cy="42" r="4.5" fill="#ffffff" />
    <circle cx="232" cy="36" r="7.5" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="232" cy="36" r="4.5" fill="#ffffff" />
    <circle cx="280" cy="36" r="7.5" fill="#00e5ff" filter="url(#glow-cyan)" />
    <circle cx="280" cy="36" r="4.5" fill="#ffffff" />
    <circle cx="320" cy="42" r="7" fill="#00c8ff" filter="url(#glow-cyan)" />
    <circle cx="320" cy="42" r="4.5" fill="#ffffff" />
    <circle cx="358" cy="48" r="7" fill="#00a2ff" filter="url(#glow-cyan)" />
    <circle cx="358" cy="48" r="4.5" fill="#ffffff" />
  </g>

  <!-- Bottom Terminal Nodes -->
  <g>
    <circle cx="154" cy="464" r="7" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="154" cy="464" r="4.5" fill="#ffffff" />
    <circle cx="192" cy="470" r="7" fill="#00d4ff" filter="url(#glow-cyan)" />
    <circle cx="192" cy="470" r="4.5" fill="#ffffff" />
    <circle cx="232" cy="476" r="7.5" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle cx="232" cy="476" r="4.5" fill="#ffffff" />
    <circle cx="280" cy="476" r="7.5" fill="#818cf8" filter="url(#glow-cyan)" />
    <circle cx="280" cy="476" r="4.5" fill="#ffffff" />
    <circle cx="320" cy="470" r="7" fill="#c084fc" filter="url(#glow-magenta)" />
    <circle cx="320" cy="470" r="4.5" fill="#ffffff" />
    <circle cx="358" cy="464" r="7" fill="#f472b6" filter="url(#glow-magenta)" />
    <circle cx="358" cy="464" r="4.5" fill="#ffffff" />
  </g>

  <!-- Left Terminal Nodes -->
  <g>
    <circle cx="48" cy="154" r="7" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="48" cy="154" r="4.5" fill="#ffffff" />
    <circle cx="42" cy="192" r="7" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="42" cy="192" r="4.5" fill="#ffffff" />
    <circle cx="36" cy="232" r="7.5" fill="#00f5ff" filter="url(#glow-cyan)" />
    <circle cx="36" cy="232" r="4.5" fill="#ffffff" />
    <circle cx="36" cy="280" r="7.5" fill="#00e5ff" filter="url(#glow-cyan)" />
    <circle cx="36" cy="280" r="4.5" fill="#ffffff" />
    <circle cx="42" cy="320" r="7" fill="#00c8ff" filter="url(#glow-cyan)" />
    <circle cx="42" cy="320" r="4.5" fill="#ffffff" />
    <circle cx="48" cy="358" r="7" fill="#00b0ff" filter="url(#glow-cyan)" />
    <circle cx="48" cy="358" r="4.5" fill="#ffffff" />
  </g>

  <!-- Right Terminal Nodes -->
  <g>
    <circle cx="464" cy="154" r="7" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle cx="464" cy="154" r="4.5" fill="#ffffff" />
    <circle cx="470" cy="192" r="7" fill="#60a5fa" filter="url(#glow-cyan)" />
    <circle cx="470" cy="192" r="4.5" fill="#ffffff" />
    <circle cx="476" cy="232" r="7.5" fill="#818cf8" filter="url(#glow-magenta)" />
    <circle cx="476" cy="232" r="4.5" fill="#ffffff" />
    <circle cx="476" cy="280" r="7.5" fill="#a78bfa" filter="url(#glow-magenta)" />
    <circle cx="476" cy="280" r="4.5" fill="#ffffff" />
    <circle cx="470" cy="320" r="7" fill="#c084fc" filter="url(#glow-magenta)" />
    <circle cx="470" cy="320" r="4.5" fill="#ffffff" />
    <circle cx="464" cy="358" r="7" fill="#f472b6" filter="url(#glow-magenta)" />
    <circle cx="464" cy="358" r="4.5" fill="#ffffff" />
  </g>

  <!-- ==================================================== -->
  <!-- 2. CENTRAL MICROCHIP CONTAINER (DARK GLASS CHIP)     -->
  <!-- ==================================================== -->

  <!-- Outer Neon Frame Glow -->
  <rect x="134" y="134" width="244" height="244" rx="42" fill="none" stroke="url(#chip-border-grad)" stroke-width="12" filter="url(#glow-cyan)" opacity="0.85" />
  
  <!-- Outer Bevel Edge -->
  <rect x="136" y="136" width="240" height="240" rx="40" fill="none" stroke="url(#chip-border-grad)" stroke-width="3.5" opacity="0.95" />

  <!-- Main Dark Chip Body (Deep Obsidian Navy Glass) -->
  <rect x="140" y="140" width="232" height="232" rx="37" fill="url(#chip-base-grad)" />

  <!-- Inset Grooved Rim -->
  <rect x="146" y="146" width="220" height="220" rx="32" fill="none" stroke="#00f5ff" stroke-width="1.8" stroke-opacity="0.35" />
  <rect x="154" y="154" width="204" height="204" rx="26" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />

  <!-- Glass Diagonal Glare Reflection -->
  <path d="M154 184 C154 166 166 154 184 154 H328 C346 154 358 166 358 184 V214 L154 314 Z" fill="url(#chip-glare)" />

  <!-- ==================================================== -->
  <!-- 3. STYLIZED 3D "T" EMBLEM (EXACT REFERENCE GEOMETRY) -->
  <!-- ==================================================== -->

  <!-- Soft Outer Halo for the "T" -->
  <g filter="url(#t-outer-glow)">
    <!-- LEFT WING -->
    <path d="M 180 176 H 244 C 248 176 250 180 248 183 L 206 225 C 204 227 201 228 198 228 H 180 C 174 228 170 224 170 218 V 186 C 170 180 174 176 180 176 Z"
          fill="url(#t-left-grad)" />

    <!-- RIGHT WING & STEM -->
    <path d="M 264 176 H 332 C 338 176 342 180 342 186 V 212 C 342 218 338 222 332 222 H 286 C 280 222 276 226 276 232 V 326 C 276 332 272 336 266 336 H 240 C 234 336 230 332 230 326 V 236 C 230 230 226 226 222 224 L 254 180 C 257 177 260 176 264 176 Z"
          fill="url(#t-main-grad)" />
  </g>

  <!-- Crisp Core Shapes for the "T" -->
  <!-- LEFT WING -->
  <path d="M 180 176 H 244 C 248 176 250 180 248 183 L 206 225 C 204 227 201 228 198 228 H 180 C 174 228 170 224 170 218 V 186 C 170 180 174 176 180 176 Z"
        fill="url(#t-left-grad)" />

  <!-- RIGHT WING & STEM -->
  <path d="M 264 176 H 332 C 338 176 342 180 342 186 V 212 C 342 218 338 222 332 222 H 286 C 280 222 276 226 276 232 V 326 C 276 332 272 336 266 336 H 240 C 234 336 230 332 230 326 V 236 C 230 230 226 226 222 224 L 254 180 C 257 177 260 176 264 176 Z"
        fill="url(#t-main-grad)" />

  <!-- 3D Bevel Highlights & Technological Facets on the "T" -->
  <!-- Left Wing Top Highlight -->
  <path d="M 180 177 H 243 C 246 177 247 179 246 181 L 244 183 H 180 C 175 183 172 181 180 177 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Left Wing Left Edge Highlight -->
  <path d="M 171 186 V 218 C 171 220 173 222 175 222 V 186 C 173 186 171 186 171 186 Z" fill="#ffffff" opacity="0.7" />

  <!-- Right Wing Top Bevel Highlight -->
  <path d="M 264 177 H 332 C 337 177 341 181 341 186 V 188 H 272 L 264 177 Z" fill="#ffffff" opacity="0.9" />

  <!-- High-Tech Diagonal Slice / Light Accent -->
  <line x1="340" y1="186" x2="230" y2="296" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.45" stroke-linecap="round" />

  <!-- Bottom Magenta Edge Glow Rim -->
  <path d="M 232 324 V 328 C 232 332 235 335 240 335 H 266 C 271 335 274 332 274 328 V 324 C 272 328 269 331 264 331 H 242 C 237 331 234 328 232 324 Z" fill="#ff00aa" opacity="0.95" />

</svg>
